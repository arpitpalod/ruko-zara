# Builds an installable Android APK in the cloud and publishes it as a download link
# (github.com/arpitpalod/ruko-zara/releases/latest), plus version.json for the in-app "update available" banner.
# Runs from the Ship workflow once all checks pass (or by hand).
name: Android APK

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ehptarxgjmtbrxerwxim.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_zzkKt2NP7Ik8PDgaayC9jw_--3SFuTl' }}
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAGGbTOnIdnDDerME' }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); Gradle fetches any missing parts.
      - run: npm ci

      # Build number = build time; the app compares it with version.json to offer updates.
      - name: Stamp build number
        run: echo "EXPO_PUBLIC_APP_BUILD=$(date +%s)" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a  # real phones only: smaller download

      - name: Write version.json
        run: |
          printf '{"build": %s, "commit": "%s"}\n' "$EXPO_PUBLIC_APP_BUILD" "${GITHUB_SHA::7}" > version.json
          cat version.json

      # Only main publishes. Run by hand on another branch, this is a build check and nothing goes live.
      - name: Publish download link
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Ruko Zara — Android (latest)
          body: Download app-release.apk on an Android phone, open it, and allow "Install unknown apps" when asked.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            version.json
          make_latest: true
